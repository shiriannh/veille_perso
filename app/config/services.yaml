parameters:
    app.analysis.positive_keywords:
        - science-fiction
        - sf
        - fantasy
        - fantastique
        - space opera
        - jeu video
        - jeux video
        - rpg
        - strategie
        - tactique
        - roman
        - bd
        - manga
        - anime
        - film
        - serie
        - auteur
        - studio
    app.analysis.negative_keywords:
        - people
        - drama
        - influenceur
        - influenceuse
        - rumeur
        - concours
        - buzz
        - polemique
        - clash
        - tele-realite
    app.analysis.boosted_phrases:
        - space opera
        - roman sf
        - jeu tactique
        - science-fiction
        - monde ouvert
        - jeu de role
    app.analysis.excluded_phrases:
        - tout le monde en parle
        - rumeur people
        - concours
        - drama
    app.analysis.minimum_relevance_score: 45
    app.analysis.clickbait_suspicion_threshold: 35
    app.analysis.clickbait_threshold: 60
    app.retention.import_run_days: '%env(int:IMPORT_RUN_RETENTION_DAYS)%'
    app.retention.ignored_entry_days: '%env(int:IGNORED_ENTRY_RETENTION_DAYS)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\Service\InterestProfile:
        arguments:
            $positiveKeywords: '%app.analysis.positive_keywords%'
            $negativeKeywords: '%app.analysis.negative_keywords%'
            $boostedPhrases: '%app.analysis.boosted_phrases%'
            $excludedPhrases: '%app.analysis.excluded_phrases%'
            $minimumRelevanceScore: '%app.analysis.minimum_relevance_score%'
            $clickbaitSuspicionThreshold: '%app.analysis.clickbait_suspicion_threshold%'
            $clickbaitThreshold: '%app.analysis.clickbait_threshold%'
            $ruleRepository: '@App\Repository\InterestProfileRuleRepository'

    App\Command\PruneImportRunsCommand:
        arguments:
            $importRunRetentionDays: '%app.retention.import_run_days%'

    App\Command\PruneIgnoredEntriesCommand:
        arguments:
            $ignoredEntryRetentionDays: '%app.retention.ignored_entry_days%'
