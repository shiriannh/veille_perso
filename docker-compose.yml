services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/app
      - app_vendor:/var/www/app/vendor
      - app_var:/var/www/app/var
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      DATABASE_URL: postgresql://veille:veille@database:5432/veille_perso?serverVersion=16&charset=utf8

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: veille_perso
      POSTGRES_USER: veille
      POSTGRES_PASSWORD: veille
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veille -d veille_perso"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    depends_on:
      - database
    ports:
      - "8081:8080"

volumes:
  app_vendor:
  app_var:
  postgres_data:
