<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/veille-error.log
    CustomLog ${APACHE_LOG_DIR}/veille-access.log combined
</VirtualHost>
